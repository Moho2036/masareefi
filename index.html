<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2.5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F4F5" />
    <meta name="description" content="بَصير - بصيرتك المالية لإدارة المصاريف والمداخيل وتتبع الميزانية الشخصية" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="بَصير" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="بَصير" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png?v=2.5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>بَصير</title>
    <script>
      (function() {
        try {
          var h = window.location.hostname;
          if (h === 'masareefi-81676.web.app' || h === 'masareefi-81676.firebaseapp.com') {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
              });
            }
            window.location.replace('https://baseer-finance.web.app' + window.location.pathname + window.location.search + window.location.hash);
            return;
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('baseer_theme') || localStorage.getItem('baseer-theme') || localStorage.getItem('masareefi_theme') || localStorage.getItem('masareefi-theme');
          var isDark = saved === 'dark' || ((!saved || saved === 'system') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var themeColorMeta = document.querySelector('meta[name="theme-color"]');
          if (themeColorMeta) {
            themeColorMeta.setAttribute('content', isDark ? '#09090B' : '#F4F4F5');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
