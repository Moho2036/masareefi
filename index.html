    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="description" content="بَصير - بصيرتك المالية لإدارة المصاريف والمداخيل وتتبع الميزانية الشخصية" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="بَصير" />

    <meta name="application-name" content="بَصير" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>بَصير</title>
    <script>
      (function() {
        try {
          var CURRENT_APP_VERSION = 'baseer_v5_2_sharp_release';
          if (localStorage.getItem('baseer_app_version') !== CURRENT_APP_VERSION) {
            localStorage.setItem('baseer_app_version', CURRENT_APP_VERSION);
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
              });
            }
            if (localStorage.getItem('baseer_has_visited')) {
              window.location.reload();
            }
            localStorage.setItem('baseer_has_visited', 'true');
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function() {
        try {
          var h = window.location.hostname;
          if (h === 'masareefi-81676.web.app' || h === 'masareefi-81676.firebaseapp.com') {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
              });
            }
            window.location.replace('https://baseer-finance.web.app' + window.location.pathname + window.location.search + window.location.hash);
            return;
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('baseer_theme') || localStorage.getItem('baseer-theme') || localStorage.getItem('masareefi_theme') || localStorage.getItem('masareefi-theme');
          var isDark = saved === 'dark' || ((!saved || saved === 'system') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var color = isDark ? '#09090B' : '#F4F4F5';
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          metas.forEach(function(m) {
            m.setAttribute('content', color);
            m.removeAttribute('media');
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
